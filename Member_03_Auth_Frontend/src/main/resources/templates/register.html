<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join LuxeStore</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="auth-bg">
    <div class="container d-flex justify-content-center align-items-center">
        <div class="card glass-card fade-in" style="width: 100%; max-width: 450px;">
            <div class="card-body p-5">
                <div class="text-center mb-5">
                    <a th:href="@{/}" class="h2 font-weight-bold text-dark text-decoration-none"
                        style="letter-spacing: -1px;">LuxeStore</a>
                    <p class="text-muted small mt-2">Join our community of premium shoppers</p>
                </div>

                <div th:if="${error}" class="alert alert-danger small border-0 fade-in mb-4"
                    style="background: rgba(220, 38, 38, 0.1); color: #dc2626;">
                    <i class="fas fa-exclamation-triangle mr-1"></i> <span th:text="${error}">Error</span>
                </div>

                <form th:action="@{/saveUser}" method="post">
                    <div class="form-group mb-4">
                        <label class="text-dark small font-weight-bold mb-2">Email Address</label>
                        <input type="email" name="email" class="form-control auth-input" placeholder="name@example.com"
                            required style="border-radius: 12px;">
                    </div>

                    <div class="form-group mb-4">
                        <label class="text-dark small font-weight-bold mb-2">Password</label>
                        <input type="password" name="password" class="form-control auth-input"
                            placeholder="Create a strong password" required style="border-radius: 12px;">
                        <p class="text-muted small mt-2">Must be at least 8 characters.</p>
                    </div>

                    <input type="hidden" name="role" value="ROLE_USER">

                    <div class="form-group mb-0 mt-5">
                        <button type="submit" class="btn btn-block auth-btn" style="border-radius: 12px; height: 50px;">
                            Create Account
                        </button>
                    </div>
                </form>

                <div class="text-center mt-5 pt-3 border-top">
                    <span class="text-muted small">Already have an account?</span>
                    <a th:href="@{/login}" class="small auth-link ml-1">Log In</a>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
